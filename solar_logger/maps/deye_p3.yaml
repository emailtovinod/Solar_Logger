# Register map for Deye three-phase hybrid inverters (SUN-*-SG0*LP3 / SG0*HP3).
# Addresses follow the community definitions in davidrapan/ha-solarman (MIT).
# NOT yet verified against a real inverter: compare a snapshot with the Deye app
# before trusting the numbers. Some scales differ between LV/HV variants.
# value = (raw - offset) * scale; multi-register values list the low word first.
model: deye_p3
signals:
  - {name: bms_charge_voltage, unit: 'V', type: u16, registers: [210], scale: 0.01, offset: 0}
  - {name: bms_discharge_voltage, unit: 'V', type: u16, registers: [211], scale: 0.01, offset: 0}
  - {name: bms_charge_current_limit, unit: 'A', type: u16, registers: [212], scale: 1, offset: 0}
  - {name: bms_discharge_current_limit, unit: 'A', type: u16, registers: [213], scale: 1, offset: 0}
  - {name: bms_soc, unit: '%', type: u16, registers: [214], scale: 1, offset: 0}
  - {name: bms_voltage, unit: 'V', type: u16, registers: [215], scale: 0.01, offset: 0}
  - {name: bms_current, unit: 'A', type: s16, registers: [216], scale: 1, offset: 0}
  - {name: bms_alarm, unit: '', type: u16, registers: [220], scale: 1, offset: 0}
  - {name: bms_fault, unit: '', type: u16, registers: [221], scale: 1, offset: 0}
  - {name: device_state, unit: '', type: u16, registers: [500], scale: 1, offset: 0}
  - {name: battery_charge_today, unit: 'kWh', type: u16, registers: [514], scale: 0.1, offset: 0}
  - {name: battery_discharge_today, unit: 'kWh', type: u16, registers: [515], scale: 0.1, offset: 0}
  - {name: battery_charge_total, unit: 'kWh', type: u32, registers: [516, 517], scale: 0.1, offset: 0}
  - {name: battery_discharge_total, unit: 'kWh', type: u32, registers: [518, 519], scale: 0.1, offset: 0}
  - {name: grid_import_today, unit: 'kWh', type: u16, registers: [520], scale: 0.1, offset: 0}
  - {name: grid_export_today, unit: 'kWh', type: u16, registers: [521], scale: 0.1, offset: 0}
  - {name: grid_import_total, unit: 'kWh', type: u32, registers: [522, 523], scale: 0.1, offset: 0}
  - {name: grid_export_total, unit: 'kWh', type: u32, registers: [524, 525], scale: 0.1, offset: 0}
  - {name: load_energy_today, unit: 'kWh', type: u16, registers: [526], scale: 0.1, offset: 0}
  - {name: load_energy_total, unit: 'kWh', type: u32, registers: [527, 528], scale: 0.1, offset: 0}
  - {name: pv_energy_today, unit: 'kWh', type: u16, registers: [529], scale: 0.1, offset: 0}
  - {name: pv_energy_total, unit: 'kWh', type: u32, registers: [534, 535], scale: 0.1, offset: 0}
  - {name: generator_energy_today, unit: 'kWh', type: u16, registers: [536], scale: 0.1, offset: 0}
  - {name: dc_temperature, unit: '°C', type: s16, registers: [540], scale: 0.1, offset: 1000}
  - {name: ac_temperature, unit: '°C', type: s16, registers: [541], scale: 0.1, offset: 1000}
  - {name: device_alarm, unit: '', type: u32, registers: [553, 554], scale: 1, offset: 0}
  - {name: battery_temperature, unit: '°C', type: u16, registers: [586], scale: 0.1, offset: 1000}
  - {name: battery_voltage, unit: 'V', type: u16, registers: [587], scale: 0.01, offset: 0}
  - {name: battery_soc, unit: '%', type: u16, registers: [588], scale: 1, offset: 0}
  - {name: battery_power, unit: 'W', type: s16, registers: [590], scale: 1, offset: 0}
