  - {name: output_l2_power, unit: 'W', type: s32, registers: [634, 692], scale: 1, offset: 0}
  - {name: ups_l2_power, unit: 'W', type: s32, registers: [641, 697], scale: 1, offset: 0}
  - {name: load_l2_voltage, unit: 'V', type: u16, registers: [645], scale: 0.1, offset: 0}
  - {name: load_l2_power, unit: 'W', type: s32, registers: [651, 657], scale: 1, offset: 0}
  - {name: output_l3_voltage, unit: 'V', type: u16, registers: [629], scale: 0.1, offset: 0}
